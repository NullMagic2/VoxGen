[package]
name = "voxgen"
version = "0.7.60"
edition = "2021"
rust-version = "1.87"
description = "VoxGen: specialized VoxCPM2 Vulkan inference engine"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
anyhow = "1"
ash = "0.38.0"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
half = "2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
